<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parodius Da! Demake - PICO-8 Port</title>
    <style>
      body {
        margin: 0; background: #120d1d; color: #f5f7ff; font-family: "Segoe UI", sans-serif; display: grid; place-items: center; height: 100vh;
      }
      .shell {
        width: min(92vw, 700px); background: #20162d; border: 2px solid #7ef6ff; border-radius: 14px; box-shadow: 0 0 24px rgba(126, 246, 255, 0.35); padding: 12px;
      }
      canvas {
        image-rendering: pixelated; width: 100%; height: auto; background: #0b1020; border-radius: 8px; display: block;
      }
      .meta {
        display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #dbeaff; padding: 10px 4px 0;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <canvas id="pico" width="256" height="128" aria-label="PICO-8 style cartridge version"></canvas>
      <div class="meta">
        <span>Parodius Da! Demake</span>
        <span>PICO-8 Cartridge Port</span>
      </div>
    </div>
    <script>
      const c = document.getElementById('pico');
      const g = c.getContext('2d');
      g.imageSmoothingEnabled = false;

      const player = { x: 18, y: 64, w: 8, h: 8, hp: 5, weapon: 0, shield: 0 };
      const bullets = [];
      const enemies = [];
      const particles = [];
      const pickups = [];
      let score = 0;
      let wave = 1;
      let timer = 0;
      let combo = 1;
      let gameOver = false;
      let started = false;

      function spawnEnemy(type = 'scout') {
        const x = 260 + Math.random() * 40;
        const y = 12 + Math.random() * 100;
        enemies.push({ x, y, w: 8, h: 8, hp: 1, type, dx: -1.1 - wave * 0.04, dy: 0 });
      }

      function shoot() {
        if (gameOver) return;
        bullets.push({ x: player.x + 8, y: player.y + 3, dx: 2.4, dy: 0 });
        if (player.weapon > 0) bullets.push({ x: player.x + 8, y: player.y + 3, dx: 2.4, dy: -0.45 });
        if (player.weapon > 1) bullets.push({ x: player.x + 8, y: player.y + 3, dx: 2.4, dy: 0.45 });
      }

      function resetWave() {
        for (let i = 0; i < 4 + wave; i++) spawnEnemy();
        if (wave % 3 === 0) enemies.push({ x: 260, y: 50, w: 16, h: 16, hp: 18 + wave, type: 'boss', dx: -0.7, dy: 0.5 });
      }

      function startGame() {
        started = true;
        gameOver = false;
        score = 0;
        wave = 1;
        combo = 1;
        player.x = 18; player.y = 64; player.hp = 5; player.weapon = 0; player.shield = 0;
        enemies.length = 0; bullets.length = 0; particles.length = 0; pickups.length = 0;
        resetWave();
      }

      document.addEventListener('keydown', (e) => {
        if (!started || gameOver) {
          if (e.key === 'Enter') startGame();
          return;
        }
        if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') player.y -= 8;
        if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') player.y += 8;
        if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') player.x -= 8;
        if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') player.x += 8;
        if (e.key === ' ' || e.key.toLowerCase() === 'z') shoot();
      });

      function update() {
        if (!started) {
          return;
        }
        if (gameOver) {
          return;
        }

        timer += 1;
        const left = (window.__keys && window.__keys.left) || false;
        const right = (window.__keys && window.__keys.right) || false;
        const up = (window.__keys && window.__keys.up) || false;
        const down = (window.__keys && window.__keys.down) || false;

        if (left) player.x -= 1.2;
        if (right) player.x += 1.2;
        if (up) player.y -= 1.2;
        if (down) player.y += 1.2;
        player.x = Math.max(4, Math.min(240, player.x));
        player.y = Math.max(8, Math.min(116, player.y));

        if (timer % 10 === 0 && started && !gameOver) shoot();

        for (let i = bullets.length - 1; i >= 0; i--) {
          bullets[i].x += bullets[i].dx * 2;
          bullets[i].y += bullets[i].dy * 2;
          if (bullets[i].x > 260) bullets.splice(i, 1);
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.x += e.dx;
          e.y += Math.sin((timer + i) * 0.1) * 0.8 + e.dy;
          if (Math.random() < 0.015) {
            bullets.push({ x: e.x, y: e.y + 3, dx: -2.6, dy: 0, enemy: true });
          }

          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (b.enemy) continue;
            if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
              e.hp -= 1;
              bullets.splice(j, 1);
              if (e.hp <= 0) {
                score += 100 * combo;
                combo = Math.min(9, combo + 1);
                particles.push({ x: e.x, y: e.y, life: 16, color: 8 });
                enemies.splice(i, 1);
                if (Math.random() < 0.22) pickups.push({ x: e.x, y: e.y, kind: Math.random() < 0.5 ? 1 : 2, r: 3 });
              }
              break;
            }
          }

          if (e.x < -10) {
            enemies.splice(i, 1);
            player.hp -= 1;
            if (player.hp <= 0) {
              gameOver = true;
            }
          }
        }

        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.x -= 0.8;
          if (Math.abs(p.x - player.x) < 10 && Math.abs(p.y - player.y) < 10) {
            if (p.kind === 1) player.weapon = Math.min(3, player.weapon + 1);
            else player.shield = Math.min(3, player.shield + 1);
            pickups.splice(i, 1);
          }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          if (bullets[i].enemy) {
            if (Math.abs(bullets[i].x - player.x) < 8 && Math.abs(bullets[i].y - player.y) < 8) {
              bullets.splice(i, 1);
              player.hp -= 1;
              if (player.hp <= 0) gameOver = true;
            }
          }
        }

        if (enemies.length === 0 && !gameOver) {
          wave += 1;
          resetWave();
          combo = 1;
        }
      }

      function draw() {
        g.fillStyle = '#0b1020';
        g.fillRect(0, 0, 256, 128);

        if (!started) {
          g.fillStyle = '#dff6ff';
          g.font = '8px monospace';
          g.fillText('press enter to play', 70, 62);
          return;
        }

        if (gameOver) {
          g.fillStyle = '#ff7f7f';
          g.font = '8px monospace';
          g.fillText('game over', 95, 58);
          g.fillText(`score ${score}`, 94, 70);
          g.fillText('press enter', 92, 82);
          return;
        }

        g.fillStyle = '#1f2940';
        for (let y = 0; y < 128; y += 8) {
          g.fillRect(0, y, 256, 2);
        }

        g.fillStyle = '#7ef6ff';
        g.fillRect(player.x, player.y, 8, 8);

        for (const b of bullets) {
          g.fillStyle = b.enemy ? '#ff9b73' : '#fefefe';
          g.fillRect(b.x, b.y, b.enemy ? 3 : 2, b.enemy ? 3 : 2);
        }

        for (const e of enemies) {
          g.fillStyle = e.type === 'boss' ? '#ff6ad5' : '#ffb26a';
          g.fillRect(e.x, e.y, e.w, e.h);
        }

        for (const p of pickups) {
          g.fillStyle = p.kind === 1 ? '#ffd166' : '#7af5ff';
          g.fillRect(p.x, p.y, 5, 5);
        }

        for (const part of particles) {
          g.fillStyle = '#ffffff';
          g.fillRect(part.x, part.y, 2, 2);
        }

        g.fillStyle = '#dfeaff';
        g.font = '6px monospace';
        g.fillText(`score ${score}`, 6, 10);
        g.fillText(`wave ${wave}`, 6, 18);
        g.fillText(`hp ${player.hp}`, 6, 26);
        g.fillText(`weapon ${player.weapon}`, 6, 34);
      }

      function tick() {
        update();
        draw();
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    </script>
  </body>
</html>
