<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Parodius Da! Demake - Neon Drift</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud-panel" id="hud">
        <div class="brand">
          <span class="brand-kicker">PARODIUS DA!</span>
          <span class="brand-name">NEON DRIFT</span>
        </div>
        <div class="stats">
          <span>Score <strong id="score">0</strong></span>
          <span>Wave <strong id="wave">1</strong></span>
          <span>Lives <strong id="lives">3</strong></span>
          <span>Weapon <strong id="weapon">RIFLE</strong></span>
        </div>
      </div>

      <canvas id="game" width="960" height="540" aria-label="Parodius demake game canvas"></canvas>

      <div class="overlay visible" id="menuOverlay">
        <div class="panel">
          <p class="eyebrow">UNOFFICIAL FAN PLAYTEST</p>
          <h1>PARODIUS DA!<br />NEON DRIFT</h1>
          <div class="controls">
            <span>Move: WASD / Arrow Keys</span>
            <span>Fire: Space / Z</span>
            <span>Upgrade: Shift / X</span>
            <span>Pause: P</span>
          </div>
          <button id="startButton" type="button">START GAME</button>
        </div>
      </div>

      <div class="overlay hidden" id="gameOverOverlay">
        <div class="panel">
          <p class="eyebrow">MISSION REPORT</p>
          <h2>GAME OVER</h2>
          <p id="finalScoreText">Final Score: 0</p>
          <button id="restartButton" type="button">RETRY</button>
        </div>
      </div>
    </div>

    <script src="js/sprites.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
